name: Windows build (MinGW-w64 cross-compile)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Cross-compiling for Windows via MinGW-w64, so a Linux runner is all we need --
    # no windows-latest runner required.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686) cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Select the win32-threads MinGW-w64 toolchain variant
        run: |
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-win32
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-win32

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-i686.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # No --target: builds the default "all" target, which is every app
        # (hlclient, hlserver, hltracker_old, hltracker_new) plus appwarrior.
        #
        # Cap parallelism: GitHub-hosted ubuntu-latest runners have 2 cores / 7GB RAM,
        # and unrestrained `--parallel` (defaults to nproc) can spawn enough concurrent
        # mingw-g++ instances compiling this codebase's larger translation units to
        # exhaust runner memory, which shows up as the job getting SIGTERM'd mid-build.
        run: cmake --build build --parallel 2

      - name: Verify executables were produced
        run: |
          file build/Apps/Client/hlclient.exe
          file build/Apps/Server/hlserver.exe
          file "build/Apps/Tracker/Old Tracker/hltracker_old.exe"
          file "build/Apps/Tracker/New Tracker/hltracker_new.exe"

      - name: Upload hlclient build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hlclient-win32
          path: |
            build/Apps/Client/hlclient.exe
            build/Apps/Client/Data/
            build/Apps/Client/Error Msgs/
          if-no-files-found: error

      - name: Upload hlserver build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hlserver-win32
          path: |
            build/Apps/Server/hlserver.exe
            build/Apps/Server/Data/
            build/Apps/Server/Error Msgs/
          if-no-files-found: error

      - name: Upload hltracker_old build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hltracker_old-win32
          path: |
            build/Apps/Tracker/Old Tracker/hltracker_old.exe
            build/Apps/Tracker/Old Tracker/Error Msgs/
          if-no-files-found: error

      - name: Upload hltracker_new build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hltracker_new-win32
          path: |
            build/Apps/Tracker/New Tracker/hltracker_new.exe
            build/Apps/Tracker/New Tracker/hltracker.dat
            build/Apps/Tracker/New Tracker/Error Msgs/
          if-no-files-found: error
